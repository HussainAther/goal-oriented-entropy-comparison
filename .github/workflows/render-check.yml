name: Verify executable Computo article

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: entropy-comparator
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Verify computational environment
        shell: bash -el {0}
        run: |
          python --version
          python -m ipykernel --version
          quarto --version

      - name: Verify archived evidence before rendering
        shell: bash -el {0}
        run: python verify_archive.py

      - name: Render executable article
        shell: bash -el {0}
        run: quarto render main.qmd --to computo-html

      - name: Verify evidence after rendering
        shell: bash -el {0}
        run: |
          python verify_archive.py
          python audit_numerical_results.py
          git diff --exit-code

      - name: Upload rendered article
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: computo-html
          path: _site/
