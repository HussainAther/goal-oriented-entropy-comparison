name: Verify archived scientific assertions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up scientific environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: entropy-comparator
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify Python environment
        shell: bash -el {0}
        run: |
          python --version
          python -m pytest --version

      - name: Run scientific regression tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v
