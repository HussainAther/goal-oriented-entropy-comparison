name: Verify archived scientific assertions

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up scientific environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: entropy-comparator
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify Python environment
        shell: bash -el {0}
        run: |
          python --version
          python -m pytest --version
          conda list

      - name: Verify archived evidence
        shell: bash -el {0}
        run: python verify_archive.py

      - name: Independently audit numerical results
        shell: bash -el {0}
        run: python audit_numerical_results.py

      - name: Run scientific regression tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v

      - name: Verify evidence preservation
        shell: bash -el {0}
        run: |
          python verify_archive.py
          git diff --exit-code
